<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8e173c">
  <title>OuyangFruit · 经典水果机</title>
  <link rel="stylesheet" href="./css/game.css">
  <link rel="stylesheet" href="./css/lights.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/texture.css">
</head>
<body>
  <main class="machine" aria-label="经典实体水果机">
    <div class="machine-heading">水果机 <span>经典街机 · 虚拟积分</span></div>
    <section class="scoreboard" aria-label="分数显示">
      <div class="score-box"><span class="score-label">WIN</span><strong class="led-digits" id="win">0000</strong></div>
      <div class="score-medallion">JP</div>
      <div class="score-box"><span class="score-label">CREDIT</span><strong class="led-digits" id="credit">1000</strong></div>
    </section>
    <section class="playfield" aria-label="外围奖项跑灯盘与中央功能盘">
      <div class="board-photo" aria-hidden="true"></div>
      <div class="center-feature-photo" aria-hidden="true"></div>
      <div class="board" id="board"></div>
      <div class="feature-led led-digits" id="feature-value" aria-label="中央功能盘数值">32</div>
      <div class="center-result" id="result" aria-live="polite"></div>
    </section>
    <div class="board-slogan">严禁赌博　仅供娱乐</div>
    <section class="bet-section" aria-label="八路独立下注">
      <div class="bet-strip" id="bet-strip"></div>
    </section>
    <section class="control-deck" aria-label="实体按键控制区">
      <div class="function-row">
        <button id="clear" class="function-key" type="button">退分 <small>CLEAR</small></button>
        <button id="sound" class="function-key sound-key" type="button" aria-pressed="true">声音 <small>ON</small></button>
        <div class="status" id="status" role="status" aria-live="polite">准备就绪 · 按红色按钮下注</div>
        <button id="start" class="start-key" type="button">START <small>启动</small></button>
      </div>
      <div class="function-bank" aria-label="预留功能控制区">
        <button type="button" disabled>上分</button><button type="button" disabled>下分</button>
        <button type="button" disabled>左移</button><button type="button" disabled>右移</button>
        <button type="button" disabled>单</button><button type="button" disabled>双</button>
        <button type="button" disabled>大</button><button type="button" disabled>小</button>
      </div>
      <div class="bet-keys" id="bet-keys"></div>
      <div class="deck-footer"><span>纯娱乐虚拟积分</span><span>按 D 打开演示模式</span></div>
    </section>
  </main>
  <aside id="debug" class="debug-panel" hidden><strong>DEMO MODE</strong><label for="forced">指定结果</label><select id="forced"><option value="">随机</option><option value="APPLE">APPLE WIN</option><option value="BELL">BELL WIN</option><option value="SEVEN">蓝九 WIN</option><option value="BAR">BAR JACKPOT</option><option value="LOSE">LOSE</option></select><button id="reset" type="button">重置积分</button></aside>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
